# ============================================================
# Weather Baseline: 96 → 96
# ============================================================
experiment:
  name: Weather_96_96_baseline
  model: TimeMixer
  seed: 2026
  description: "Baseline TimeMixer reproduction on Weather dataset, 96→96 horizon"

dataset:
  name: Weather
  root_path: ./dataset/weather/
  data_path: weather.csv
  data: custom
  features: M
  target: OT
  freq: h
  seq_len: 96
  label_len: 48
  pred_len: 96
  enc_in: 21
  dec_in: 21
  c_out: 21

model_params:
  d_model: 16
  n_heads: 8
  e_layers: 2
  d_layers: 1
  d_ff: 32
  factor: 3
  dropout: 0.1
  embed: timeF
  channel_independence: 1
  decomp_method: moving_avg
  moving_avg: 25
  down_sampling_layers: 3
  down_sampling_window: 2
  down_sampling_method: avg
  use_norm: 1
  use_future_temporal_feature: 0

training:
  batch_size: 16
  learning_rate: 0.01
  train_epochs: 20
  patience: 10
  use_amp: false
  num_workers: 4
  lradj: type1
  loss: MSE
